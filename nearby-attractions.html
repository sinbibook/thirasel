<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>보령 티라셀 오션뷰 펜션</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link rel="stylesheet" type="text/css" href="styles/popup.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="보령 티라셀 오션뷰 펜션" />
  <meta property="og:description" content="바다와 함께 청량한 하루를 시작하는 보령 티라셀 오션뷰 펜션입니다. 전 객실 오션뷰엔 유명한 무창포 해수욕장이 펼쳐져 있습니다." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/08/04/C0evJ43Hs26y.jpg" />
  <meta property="og:url" content="https://thirasel.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="보령 티라셀 오션뷰 펜션" />
  <meta name="twitter:description" content="바다와 함께 청량한 하루를 시작하는 보령 티라셀 오션뷰 펜션입니다. 전 객실 오션뷰엔 유명한 무창포 해수욕장이 펼쳐져 있습니다." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/08/04/C0evJ43Hs26y.jpg" />
  <meta name="naver-site-verification" content="f9d765be987eb11a5b87c35f4fa87b837d918b1f" />
  <meta name="google-site-verification" content="kFdAp2rByTI9cLS4b0eUF4KNxJARBL4_2TMkH0nu5tc" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <!-- 원본 travel.html. 슬라이더가 없는 정적 페이지다.
             원본 #content 클래스가 `sub4_1 sub_reservation` 인데 이용안내 페이지와
             같은 값이다(원본의 복사 흔적). 이 페이지 전용 스코프 규칙이 없어
             그대로 두어도 문제는 없다. -->
        <section id="content" class="sub4_1 sub_reservation">
          <!-- ── 히어로 — 슬라이더가 아닌 고정 배경 ──────────────── -->
          <div class="sub_visual_wide" data-nearby-hero>
            <div class="visual_box">
              <div class="visual_txt">
                <strong>TRAVEL</strong>
                <p data-nearby-hero-description></p>
              </div>
            </div>
          </div>
          <!--// sub_visual -->

          <div class="sub_location_wrap">
            <div class="inner">
              <ul class="location_box">
                <li>홈</li>
                <li>TRAVEL</li>
                <li><a href="./nearby-attractions.html">주변 여행지</a></li>
              </ul>
              <ul class="cate_box">
                <li class="on"><a href="./nearby-attractions.html">주변 여행지</a></li>
              </ul>
            </div>
          </div>

          <div class="sub_cont">
            <div class="sub_title_box">
              <h3 data-nearby-title></h3>
              <p data-nearby-lead></p>
            </div>

            <!-- 2열 float 목록. `01.` 번호는 매퍼가 넣지 않는다 —
                 CSS 의 `.travel_list ul li strong:before` 가 counter 로 붙인다. -->
            <div class="travel_list inner">
              <ul data-nearby-list></ul>
            </div>
          </div>
          <!--// sub_cont -->
        </section>
      </div>
      <!--// container -->

      <div id="footer-wrap"></div>
    </div>

    <div id="popup-container"></div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/nearby-attractions-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
